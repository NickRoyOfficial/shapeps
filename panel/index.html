<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ShapePS</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <main id="studio">
    <header class="masthead">
      <h1>SHAPE<span>PS</span></h1>
      <button id="update" class="quiet" type="button">Check updates</button>
    </header>
    <div id="update-message" class="update-message" role="status" hidden>
      <span id="update-status"></span>
      <button id="releases" class="quiet" type="button" hidden>Releases</button>
    </div>

    <section class="preview" aria-label="Shape preview">
      <img id="preview" alt="Preview of the shape with its fill and contour lines" hidden>
      <p id="preview-status">Open an RGB document</p>
    </section>

    <div class="output" role="group" aria-label="Output">
      <button id="vector" type="button" class="segment selected" aria-pressed="true">Vector</button>
      <button id="raster" type="button" class="segment" aria-pressed="false">Raster</button>
    </div>
    <button id="generate" class="generate" type="button">Generate shape</button>
    <p id="status" class="status" role="status" hidden></p>

    <section class="controls" aria-labelledby="shape-title">
      <h2 id="shape-title">Shape</h2>
      <div class="control-pair">
        <div class="grow">
          <label class="sr-label" for="preset">Shape preset</label>
          <select id="preset"></select>
        </div>
        <button id="random" type="button" class="secondary">Randomize</button>
      </div>
      <div id="seed-row" class="seed-row">
        <label for="seed">Blob seed</label>
        <input id="seed" type="text" inputmode="numeric" maxlength="6" value="38">
      </div>
      <div class="range-row">
        <div class="range-label"><label for="size">Size</label><output id="size-value">60%</output></div>
        <input id="size" type="range" min="2" max="96" value="60">
      </div>
    </section>

    <section class="controls" aria-labelledby="fill-title">
      <h2 id="fill-title">Fill</h2>
      <div class="segments" role="group" aria-label="Fill type">
        <button id="solid" type="button" class="segment selected" aria-pressed="true">Solid</button>
        <button id="gradient" type="button" class="segment" aria-pressed="false">Gradient</button>
      </div>
      <div class="color-row">
        <button id="first" type="button" class="color-button" aria-expanded="false" aria-controls="picker">
          <span id="first-chip" class="chip"></span><span id="first-label">Fill color</span>
        </button>
        <button id="second" type="button" class="color-button" aria-expanded="false" aria-controls="picker" hidden>
          <span id="second-chip" class="chip"></span><span>End color</span>
        </button>
      </div>
      <div id="angle-row" class="range-row" hidden>
        <div class="range-label"><label for="angle">Angle</label><output id="angle-value">45°</output></div>
        <input id="angle" type="range" min="-180" max="180" value="45">
      </div>
      <div id="fill-picker"></div>
    </section>

    <section class="controls" aria-labelledby="contour-title">
      <h2 id="contour-title">Contours</h2>
      <div class="range-row">
        <div class="range-label"><label for="count">Topo lines</label><output id="count-value">7</output></div>
        <input id="count" type="range" min="0" max="18" value="7">
      </div>
      <div class="color-row">
        <button id="line" type="button" class="color-button" aria-expanded="false" aria-controls="picker">
          <span id="line-chip" class="chip"></span><span>Line color</span>
        </button>
      </div>
      <div id="line-picker"></div>
    </section>
    <div id="picker" class="picker" hidden>
      <div id="color-plane" class="color-plane" tabindex="0" role="group"
        aria-label="Saturation and brightness. Use arrow keys to adjust.">
        <div class="color-white"></div>
        <div class="color-black"></div>
        <div id="color-marker" class="color-marker"></div>
      </div>
      <div class="range-row">
        <div class="range-label"><label for="hue">Hue</label><output id="hue-value"></output></div>
        <input id="hue" type="range" min="0" max="359" value="0">
      </div>
      <div class="picker-actions">
        <label for="hex">Hex</label>
        <input id="hex" type="text" spellcheck="false" maxlength="7">
        <button id="dismiss-color" type="button" class="quiet">Cancel</button>
        <button id="apply-color" type="button" class="secondary">Done</button>
      </div>
      <p id="color-error" role="status" hidden>Enter a six-digit hex color.</p>
    </div>
  </main>
  <script src="panel.js"></script>
</body>
</html>
